name: Build VST3 (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tai JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git extern/JUCE

      - name: Cau hinh CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 + Standalone
        run: cmake --build build --config Release --target TKVocalStudio_VST3 TKVocalStudio_Standalone --parallel

      - name: Dong goi
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "build/TKVocalStudio_artefacts/Release/VST3/TK VOCAL STUDIO.vst3" dist/
          Copy-Item "build/TKVocalStudio_artefacts/Release/Standalone/TK VOCAL STUDIO.exe" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: TK-VOCAL-STUDIO-Windows
          path: dist
